name: Build OkraLinux LiveCD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  livecd:
    name: Fedora ${{ matrix.release }} LiveCD
    runs-on: ubuntu-24.04
    container:
      image: fedora:${{ matrix.release }}
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        release: ['41']
    steps:
      - name: Install build dependencies
        run: |
          dnf -y update
          dnf -y install \
            bash binutils cpio gcc gzip make mtools \
            qemu-img qemu-system-x86-core squashfs-tools \
            xorriso xz git findutils file patch bc flex bison \
            autoconf automake libtool openssl-devel \
            elfutils-libelf-devel perl dwarves util-linux-core python3 llvm

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: okra-linux

      - name: Check out OkraLinux kernel
        uses: actions/checkout@v4
        with:
          repository: OkraLinux/KERNEL
          path: linux-7.2
          fetch-depth: 1

      - name: Check out OkraPM kernel interface
        uses: actions/checkout@v4
        with:
          repository: OkraLinux/okrapm
          path: okrapm-source
          fetch-depth: 1

      - name: Install OkraPM kernel interface
        run: |
          mkdir -p linux-7.2/okrapm
          cp -a okrapm-source/Kconfig okrapm-source/Makefile \
            okrapm-source/include okrapm-source/src linux-7.2/okrapm/

      - name: Check out Limine
        uses: actions/checkout@v4
        with:
          repository: limine-bootloader/limine
          path: limine
          ref: v12.x
          fetch-depth: 1

      - name: Build Limine tools
        working-directory: limine
        run: |
          ./bootstrap
          ./configure \
            LD_FOR_TARGET=/usr/bin/ld \
            CC_FOR_TARGET=/usr/bin/gcc \
            OBJCOPY_FOR_TARGET=/usr/bin/objcopy
          make -j2

      - name: Create kernel configuration
        working-directory: linux-7.2
        run: |
          make defconfig
          scripts/config --enable DEVTMPFS
          scripts/config --enable DEVTMPFS_MOUNT
          scripts/config --enable BLK_DEV_LOOP
          scripts/config --enable BLK_DEV_SR
          scripts/config --enable ISO9660_FS
          scripts/config --enable SQUASHFS
          scripts/config --enable SQUASHFS_ZSTD
          scripts/config --enable OVERLAY_FS
          scripts/config --enable VIRTIO
          scripts/config --enable VIRTIO_PCI
          scripts/config --enable VIRTIO_BLK
          scripts/config --enable OKRAPM
          make olddefconfig

      - name: Prepare initramfs runtime libraries
        working-directory: okra-linux
        run: |
          mkdir -p live-build/initramfs/lib64
          python3 - <<'PY'
          import os
          import re
          import shutil
          import subprocess
          from pathlib import Path

          initramfs = Path('live-build/initramfs')
          destination = initramfs / 'lib64'
          binaries = [p for p in (initramfs / 'bin').iterdir() if p.is_file()]
          libraries = set()
          for binary in binaries:
              result = subprocess.run(['ldd', str(binary)], text=True, capture_output=True, check=True)
              for line in result.stdout.splitlines():
                  match = re.search(r'=> (\S+)|^\s*(/\S+)', line)
                  if match:
                      path = match.group(1) or match.group(2)
                      if os.path.isabs(path) and os.path.exists(path):
                          libraries.add(path)
          for path in libraries:
              shutil.copy2(path, destination / os.path.basename(path))
          PY

      - name: Build Fedora rootfs and LiveCD
        working-directory: okra-linux
        env:
          FEDORA_ROOTFS: '1'
          FEDORA_RELEASE: ${{ matrix.release }}
          SKIP_QEMU: '1'
          JOBS: '2'
        run: |
          chmod +x live-build/scripts/* live-build/initramfs/init
          live-build/scripts/build-livecd

      - name: Validate ISO
        working-directory: okra-linux
        run: |
          test -s okra-linux-livecd.iso
          file okra-linux-livecd.iso
          xorriso -indev okra-linux-livecd.iso -toc

      - name: Upload LiveCD artifact
        uses: actions/upload-artifact@v4
        with:
          name: okralinux-livecd-fedora-${{ matrix.release }}
          path: okra-linux/okra-linux-livecd.iso
          if-no-files-found: error
          compression-level: 0
